[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "moodio"
version = "2.2.1"
description = "Music emotion with optional 12-axis diagnostics, local lyrics ASR, and online source research in the Host plugin."
readme = "../README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "moodio contributors" }]
keywords = ["music", "emotion", "valence", "arousal", "mir", "agent"]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
]

[project.optional-dependencies]
neural = ["torch>=2.0", "transformers>=4.30"]
lyrics = ["faster-whisper>=1.0"]

[project.scripts]
moodio = "moodio:main"

[tool.setuptools]
py-modules = ["moodio"]
packages = ["music_emotion"]
