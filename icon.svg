<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Music emotion">
  <defs>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0f172a"/>
  <!-- four bars: valence, arousal, texture, grandeur -->
  <g fill="url(#wave)">
    <rect x="13" y="34" width="7" height="17" rx="3.5"/>
    <rect x="24" y="20" width="7" height="31" rx="3.5"/>
    <rect x="35" y="27" width="7" height="24" rx="3.5"/>
    <rect x="46" y="14" width="7" height="37" rx="3.5"/>
  </g>
  <!-- a note head tying it to audio -->
  <circle cx="18" cy="49" r="4" fill="#e2e8f0" opacity="0.9"/>
</svg>
