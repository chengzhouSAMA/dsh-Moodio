name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-plugin:
    name: Node plugin contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Syntax check
        run: node --check index.js

      - name: Offline contract tests
        run: node test/offline.test.mjs

      - name: Research contract tests
        run: node --test test/research.test.mjs

      - name: Validate manifest and locale JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('locale/en.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('locale/zh.json','utf8'))"

  python-analyzer:
    name: Python analyzer (${{ matrix.python-version }})
    # ubuntu-latest moved to Ubuntu 26.04 in October 2026 and the
    # actions/python-versions manifest publishes no 3.9 build for that image,
    # so setup-python failed before any test ran. 3.9 stays covered on 22.04,
    # which still has a published 3.9 build; 3.12 runs on the current image.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt

      # These suites are self-contained: they synthesise their own stimuli or
      # use fixed feature probes, so CI needs no audio corpus.
      - name: Unit and calibration tests
        working-directory: python
        run: |
          python tests/validate_calibration.py
          python tests/test_emotion_taxonomy.py
          python tests/test_texture.py
          python tests/test_four_axis.py
          python tests/test_batch.py
          python tests/test_axes_v2.py
          python tests/test_lyrics.py

      - name: Directionality (synthesised stimuli, slower)
        if: matrix.python-version == '3.12'
        working-directory: python
        run: python tests/validate_directionality.py

      - name: CLI smoke test
        working-directory: python
        run: |
          python - <<'PY'
          import numpy as np, soundfile as sf
          sr = 22050
          t = np.arange(int(sr * 3)) / sr
          y = 0.3 * np.sin(2 * np.pi * 220 * t)
          sf.write("smoke.wav", y.astype("float32"), sr)
          PY
          python moodio.py analyze --path smoke.wav --no-segments --fields emotion,emotion_4d
          python moodio.py --version
